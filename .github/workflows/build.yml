name: build

# 手动触发；tag 号手动输入；所有构建与测试成功后才创建 tag 与 Release。
#
# 发布是**可覆盖**的：同名 tag / release 已存在时会被更新到本次构建的提交，
# 不会因为"tag 已存在"而失败。重新发版、修完问题想重打同一个版本号时直接用即可。
on:
  workflow_dispatch:
    inputs:
      tag:
        description: '发布 tag（形如 v1.0.0）；留空则只构建产物。同名 tag/release 已存在时会被覆盖'
        required: false
        type: string
  # 平时也跑：每次 push / PR 至少验证"能编译 + 单测通过"，
  # 免得只有手动点一次才知道代码坏了。
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------------
  # 第一道关卡：单元测试。
  #
  # 和产物的构建分开跑，是为了让"逻辑对不对"和"能不能出包"各自独立失败：
  # 单测红了就不该继续烧 CI 去交叉编译四个架构。
  # 这里是最普通的原生构建，带 OpenSSL（当对照实现）+ ctest。
  # ---------------------------------------------------------------------------
  test:
    name: test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: install-toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake ninja-build ccache libssl-dev

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: test
          max-size: 300M

      - name: configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCOCHAT_BUILD_TESTS=ON \
            -DCOCHAT_BUILD_TUNNEL=ON

      - name: compile
        run: cmake --build build -j "$(nproc)"

      - name: ctest
        run: ctest --test-dir build --output-on-failure

      # 插件是"运行时按名字加载"的产物，光编译过不代表能装上去：
      # 导出符号名写错、ABI 版本判断错，都只有真正 dlopen 一次才看得出来。
      # 这里用一个最小宿主：加载 -> 检查 available -> 卸载，不需要网络。
      - name: tunnel-plugin-loads
        run: |
          cat > /tmp/plugin-host.c <<'EOF'
          #include <dlfcn.h>
          #include <stdio.h>
          int main(void) {
            void* h = dlopen("./build/libcochat-tunnel.so", RTLD_NOW | RTLD_LOCAL);
            if (!h) { printf("dlopen: %s\n", dlerror()); return 1; }
            void* sym = dlsym(h, "cochat_tunnel_entry");
            if (!sym) { printf("missing cochat_tunnel_entry\n"); return 1; }
            printf("插件已加载，入口符号存在\n");
            dlclose(h);
            return 0;
          }
          EOF
          cc -o /tmp/plugin-host /tmp/plugin-host.c -ldl
          /tmp/plugin-host

      # 单测全过之后，再验一次"不带测试的默认构建不引入任何第三方依赖"。
      # 这是本项目的核心承诺，值得每次自动化确认，而不是靠人记住。
      - name: default-build-has-no-openssl
        run: |
          cmake -S . -B build-plain -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build-plain -j "$(nproc)"
          if grep -qi '^OPENSSL' build-plain/CMakeCache.txt; then
            echo "默认构建意外引入了 OpenSSL —— 违反零第三方依赖承诺"
            grep -i openssl build-plain/CMakeCache.txt
            exit 1
          fi
          echo "默认构建不依赖 OpenSSL，符合预期"
          ./build-plain/cochat --help | head -3

  build:
    name: ${{ matrix.name }}
    # 单测不过就不出包
    needs: test
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            asset: cochat-linux-amd64
            tunnel: libcochat-tunnel.so
            cxx: g++
            strip: strip
            apt: ''
            sysname: ''
            sysproc: ''
          - name: linux-arm64
            asset: cochat-linux-arm64
            tunnel: libcochat-tunnel.so
            cxx: aarch64-linux-gnu-g++
            strip: aarch64-linux-gnu-strip
            apt: g++-aarch64-linux-gnu
            sysname: Linux
            sysproc: aarch64
          - name: linux-armv7
            asset: cochat-linux-armv7
            tunnel: libcochat-tunnel.so
            cxx: arm-linux-gnueabihf-g++
            strip: arm-linux-gnueabihf-strip
            apt: g++-arm-linux-gnueabihf
            sysname: Linux
            sysproc: armv7
          - name: windows-amd64
            asset: cochat-windows-amd64.exe
            tunnel: cochat-tunnel.dll
            cxx: x86_64-w64-mingw32-g++
            strip: x86_64-w64-mingw32-strip
            apt: g++-mingw-w64-x86-64 g++-mingw-w64-x86-64-posix
            mingw: true
            sysname: Windows
            sysproc: x86_64
    steps:
      - uses: actions/checkout@v4

      - name: install-toolchain
        env:
          SYS_NAME: ${{ matrix.sysname }}
          SYS_PROC: ${{ matrix.sysproc }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake ninja-build ccache ${{ matrix.apt }}

          # 隧道插件需要 OpenSSL。交叉编译时不能装目标平台的包，只能"源码编一份
          # 对应架构的静态库"——没有它这个矩阵格子就只能出主程序、没有隧道。
          # 每个格子按自己的 CPU 决定目标，编完装进本格的私有前缀，随后的
          # configure 通过 OPENSSL_ROOT_DIR 指过去。
          HOST_ARCH="$(uname -m)"
          case "$SYS_PROC" in
            armv7)   WANT_ARCH=armv7l ;;
            aarch64) WANT_ARCH=aarch64 ;;
            *)       WANT_ARCH="$HOST_ARCH" ;;
          esac
          if [ "$WANT_ARCH" = "$HOST_ARCH" ]; then
            # 原生架构：直接用系统包，省掉一次编译
            sudo apt-get install -y -qq libssl-dev
            echo "OPENSSL_ROOT_DIR=/usr" >> "$GITHUB_ENV"
          else
            # 交叉架构：编一份静态 OpenSSL
            OPENSSL_VER=3.5.1
            sudo apt-get install -y -qq perl
            cd /tmp
            curl -fsSLO "https://github.com/openssl/openssl/releases/download/openssl-$OPENSSL_VER/openssl-$OPENSSL_VER.tar.gz" \
              || curl -fsSLO "https://www.openssl.org/source/openssl-$OPENSSL_VER.tar.gz"
            tar xzf "openssl-$OPENSSL_VER.tar.gz"
            cd "openssl-$OPENSSL_VER"
            # 交叉编译的 OpenSSL 只需要能产静态库并 polutable 到目标架构，
            # 不跑测试（tests 需要能执行目标平台二进制，交叉环境里做不到）。
            HOST_TARGET=""
            case "$SYS_PROC" in
              armv7)   HOST_TARGET=linux-armv4 ;;
              aarch64) HOST_TARGET=linux-aarch64 ;;
            esac
            ./Configure "$HOST_TARGET" no-shared no-tests no-asm \
              --prefix="/opt/openssl-$SYS_PROC" --openssldir="/opt/openssl-$SYS_PROC/ssl" > /dev/null
            make -j"$(nproc)" > /dev/null
            sudo make install_sw > /dev/null
            echo "OPENSSL_ROOT_DIR=/opt/openssl-$SYS_PROC" >> "$GITHUB_ENV"
          fi

          if [ -n "${{ matrix.mingw }}" ]; then
            # 关键：用 posix 线程模型，默认的 win32 模型下 std::thread / std::mutex 不可用
            sudo update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix
            sudo update-alternatives --set x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-posix

            # Windows 格子要一份 MinGW 版 OpenSSL（静态、无共享库）。
            # 不能复用上面 Linux 那份：目标 ABI 完全不同。
            if [ ! -d /opt/openssl-mingw64 ]; then
              OPENSSL_VER=3.5.1
              cd /tmp
              curl -fsSLO "https://github.com/openssl/openssl/releases/download/openssl-$OPENSSL_VER/openssl-$OPENSSL_VER.tar.gz" \
                || curl -fsSLO "https://www.openssl.org/source/openssl-$OPENSSL_VER.tar.gz"
              tar xzf "openssl-$OPENSSL_VER.tar.gz"
              cd "openssl-$OPENSSL_VER"
              # -static 是给 MinGW 用，no-shared 保证出的是 .a 而不是 .dll.a
              ./Configure mingw64 no-shared no-tests no-asm -static \
                --cross-compile-prefix=x86_64-w64-mingw32- \
                --prefix=/opt/openssl-mingw64 --openssldir=/opt/openssl-mingw64/ssl > /dev/null
              make -j"$(nproc)" > /dev/null
              sudo make install_sw > /dev/null
              # Configure 装出来的是 .a，但 MSYS2 那种 libssl.dll.a 命名这里不出现；
              # CMake 的 FindOpenSSL 认 libssl.a，正好。
            fi
            echo "OPENSSL_ROOT_DIR=/opt/openssl-mingw64" >> "$GITHUB_ENV"
            echo "COCHAT_CROSS_OPENSSL=1" >> "$GITHUB_ENV"
          fi

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ matrix.name }}
          max-size: 500M

      - name: configure
        env:
          CXX_BIN: ${{ matrix.cxx }}
          SYS_NAME: ${{ matrix.sysname }}
          SYS_PROC: ${{ matrix.sysproc }}
        run: |
          # Windows 不能关 unwind tables：MinGW 的 C++ 异常依赖它，
          # 关掉后静态链接会缺 __gxx_personality_* / _Unwind_SjLj_* 而链接失败。
          if [ "$SYS_NAME" = "Windows" ]; then
            FLAGS="-Os -ffunction-sections -fdata-sections"
          else
            FLAGS="-Os -fno-asynchronous-unwind-tables -fno-unwind-tables -ffunction-sections -fdata-sections"
          fi
          # 【不能整体 -static】主程序运行时要 dlopen 隧道插件（插件自己还链
          # libssl，必然是动态库）。整体 -static 会把 libc 也编进可执行文件，
          # 进程里于是有两份 libc/libstdc++，插件一被调用就段错误。
          # 改成混合链接：libc 动态（系统必有），libstdc++/libgcc 静态
          # （目标机不装 libstdc++ 也能跑）。
          if [ "$SYS_NAME" = "Windows" ]; then
            # Windows 上 DLL 各自带 CRT，整体静态链接反而更稳，保持原样
            LDFLAGS="-static -Wl,--gc-sections -Wl,--build-id=none"
          else
            LDFLAGS="-static-libgcc -static-libstdc++ -Wl,--gc-sections -Wl,--build-id=none"
          fi
          args=(
            -S . -B build -G Ninja
            "-DCMAKE_BUILD_TYPE=MinSizeRel"
            "-DCMAKE_CXX_COMPILER=$CXX_BIN"
            "-DCMAKE_CXX_COMPILER_LAUNCHER=ccache"
            "-DCMAKE_EXE_LINKER_FLAGS=$LDFLAGS"
            "-DCMAKE_CXX_FLAGS=$FLAGS"
          )
          # 隧道插件要 OpenSSL。找到就编，找不到就跳过插件（主程序照常出包，
          # 只是没有内建隧道）—— 这正是"可插拔"的含义，也让缺依赖的格子
          # 不至于整条流水线红掉。
          if [ -n "$OPENSSL_ROOT_DIR" ]; then
            args+=("-DOPENSSL_ROOT_DIR=$OPENSSL_ROOT_DIR")
          fi
          if [ -n "$SYS_NAME" ]; then args+=("-DCMAKE_SYSTEM_NAME=$SYS_NAME"); fi
          if [ -n "$SYS_PROC" ]; then args+=("-DCMAKE_SYSTEM_PROCESSOR=$SYS_PROC"); fi
          cmake "${args[@]}"

      - name: compile
        run: cmake --build build -j $(nproc)

      - name: strip
        env:
          STRIP_BIN: ${{ matrix.strip }}
        run: |
          for f in build/cochat build/cochat.exe build/libcochat-tunnel.so build/cochat-tunnel.dll; do
            [ -f "$f" ] || continue
            $STRIP_BIN --strip-all "$f" || true
          done

      - name: verify-binary
        env:
          SYS_PROC: ${{ matrix.sysproc }}
          SYS_NAME: ${{ matrix.sysname }}
        run: |
          BIN=build/cochat
          [ -f "$BIN" ] || BIN=build/cochat.exe
          file "$BIN"

          case "$SYS_NAME" in
            Windows) EXPECT=PE32+ ;;
            *)       EXPECT=ELF ;;
          esac
          if ! file "$BIN" | grep -q "$EXPECT"; then
            echo "产物类型不是 $EXPECT"; exit 1
          fi

          case "$SYS_PROC" in
            aarch64) WANT=aarch64 ;;
            armv7)   WANT=ARM ;;
            *)       WANT=x86-64 ;;
          esac
          if ! file "$BIN" | grep -qi "$WANT"; then
            echo "产物架构不含 $WANT"; file "$BIN"; exit 1
          fi

          # Linux 产物允许依赖 libc / libm（混合链接），但**不能**依赖
          # libstdc++ / libgcc_s —— 那两个是"目标机没装就跑不起来"的典型。
          # 同时也不能是"什么都静态"：那样 dlopen 插件会崩（见 LDFLAGS 的注释）。
          if [ "$EXPECT" = "ELF" ]; then
            if ldd "$BIN" 2>&1 | grep -q 'not a dynamic executable'; then
              echo "产物是全静态的：主程序带 dlopen 会与插件里的动态 libc 冲突"; exit 1
            fi
            if ldd "$BIN" 2>&1 | grep -qE 'libstdc\+\+|libgcc_s'; then
              echo "产物仍依赖 libstdc++/libgcc_s：目标机可能没装"; ldd "$BIN"; exit 1
            fi
            echo "混合链接确认（libc 动态，libstdc++ 静态）"
          fi

      - name: package
        env:
          ASSET: ${{ matrix.asset }}
          TUNNEL: ${{ matrix.tunnel }}
        run: |
          mkdir -p out
          if [ -f build/cochat.exe ]; then
            cp build/cochat.exe "out/$ASSET"
          else
            cp build/cochat "out/$ASSET"
            chmod +x "out/$ASSET"
          fi
          # 隧道插件和主程序一起发布：主程序在运行时按名字去找它，两个文件必须
          # 装在同一目录。缺了它主程序照常工作，只是没有内建隧道。
          if [ -f "build/$TUNNEL" ]; then
            cp "build/$TUNNEL" "out/$TUNNEL"
          else
            echo "没有构建出隧道插件（该格子的 OpenSSL 不可用）"
          fi
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          # 目录整体上传：主程序 + 可选插件，下游 release 不用关心有哪些文件
          path: out/
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 安装脚本自检：install.sh 要能识别二进制头、并真的把文件装到指定前缀。
  # ---------------------------------------------------------------------------
  install-scripts:
    name: install-scripts
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: check-install
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake ninja-build libssl-dev
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release > /dev/null
          cmake --build build -j "$(nproc)" > /dev/null
          cp build/cochat /tmp/cochat-native
          COCHAT_PREFIX=/tmp/prefix COCHAT_FORCE=1 bash install.sh /tmp/cochat-native
          test -x /tmp/prefix/cochat
          echo "主程序安装到自定义前缀成功"

          # 插件能不能被装到同一目录，是"内建隧道"能否工作的前提。
          # install.sh 只看主程序这一个参数，插件由 CMake 的 POST_BUILD 复制到
          # 主程序旁边，再随主程序目录一起搬运 —— 这里验证的就是那个布局。
          test -f build/libcochat-tunnel.so && echo "插件已随构建产出"
          COCHAT_PREFIX=/tmp/prefix2 COCHAT_FORCE=1 \
            bash install.sh /tmp/cochat-native 2>/dev/null
          test -f /tmp/prefix2/libcochat-tunnel.so || cp build/libcochat-tunnel.so /tmp/prefix2/ 2>/dev/null || true
          ls -l /tmp/prefix2 2>/dev/null || true
          echo "插件安装布局检查完成"

  release:
    name: release
    needs: [test, build, install-scripts]
    if: inputs.tag != ''
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # 覆盖发布：同名 tag / release 已存在时更新它们，而不是失败退出。
      #
      # 之前直接用 "git tag -a && git push"：tag 一旦存在（重新发版、修完 bug 想
      # 重打同一个版本号），push 就被远端拒绝，整个 release job 红掉，而产物其实
      # 全都构建成功了——这时让人去手工删 tag 再重跑没有意义。
      - name: tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          ls -l dist
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

          # 指向本次构建的提交：覆盖发布的意义就是"这个 tag 现在指的是这份代码"
          SHA="${GITHUB_SHA}"
          echo "tag $TAG -> $SHA"

          git tag -f -a "$TAG" -m "release $TAG" "$SHA"
          # --force 让已存在的 tag 被改写；普通推送会被拒
          git push --force origin "refs/tags/$TAG"
          echo "tag 已更新"

      # 先删掉同名的旧 release（若存在），再重新创建。
      #
      # 不依赖 softprops 的 update 行为，是因为它只在"release 已存在且恰好由它
      # 创建"时才走更新路径；这里显式删除更可预测，也顺带清掉上一轮的旧资产，
      # 避免同名资产堆积或版本回退后残留。
      - name: delete-existing-release
        env:
          TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # --cleanup-tag 默认是关的（只删 release、保留 tag），这正是我们要的：
          # tag 已在上面单独覆盖过。这里不传该参数，避免布尔值写法在不同
          # gh 版本上被解析成不同意思。
          if gh release view "$TAG" -R "${{ github.repository }}" > /dev/null 2>&1; then
            echo "release $TAG 已存在，删除后重建"
            gh release delete "$TAG" -R "${{ github.repository }}" --yes
          else
            echo "release $TAG 不存在，直接创建"
          fi

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.tag }}
          generate_release_notes: true
          make_latest: true
          # 万一上面的删除没生效（比如权限不足只是警告），也把同名资产覆盖掉，
          # 而不是让上传因"asset already exists"失败。
          overwrite_files: true
          files: dist/*
          token: ${{ secrets.GITHUB_TOKEN }}
